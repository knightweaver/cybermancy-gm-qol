name: Publish Compatibility Release Alias

on:
  push:
    branches: [main]
    paths:
      - "compatibility-release-control/*.json"
  workflow_dispatch:
    inputs:
      control:
        description: "Compatibility release-control file"
        required: true
        default: "compatibility-release-control/F13-DH1.json"

concurrency:
  group: cybermancy-gm-qol-compatibility-alias
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-alias:
    runs-on: ubuntu-latest
    env:
      CONTROL: ${{ github.event.inputs.control || 'compatibility-release-control/F13-DH1.json' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read compatibility alias control
        id: control
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          data=json.load(open(os.environ["CONTROL"]))
          print(f"alias_tag={data['aliasTag']}")
          print(f"canonical_tag={data['canonicalTag']}")
          print(f"title={data['title']}")
          print(f"runtime_sha256={data['qualifiedRuntimeSha256']}")
          print(f"runtime_asset={data['runtimeAsset']}")
          PY

      - name: Download canonical release assets
        shell: bash
        run: |
          mkdir -p alias-assets
          gh release download "${{ steps.control.outputs.canonical_tag }}" \
            --dir alias-assets \
            --pattern "${{ steps.control.outputs.runtime_asset }}" \
            --pattern "module.json" \
            --pattern "SHA256SUMS.txt"

      - name: Verify canonical release and exact qualified runtime
        shell: bash
        run: |
          ALIAS="${{ steps.control.outputs.alias_tag }}"
          CANONICAL="${{ steps.control.outputs.canonical_tag }}"
          ARCHIVE="${{ steps.control.outputs.runtime_asset }}"
          EXPECTED="${{ steps.control.outputs.runtime_sha256 }}"

          test "$(sha256sum "alias-assets/$ARCHIVE" | awk '{print $1}')" = "$EXPECTED"

          git fetch --force --tags
          CANONICAL_COMMIT="$(git rev-list -n 1 "$CANONICAL")"
          test -n "$CANONICAL_COMMIT"

          TARGET="$(gh release view "$CANONICAL" --json targetCommitish --jq .targetCommitish)"
          if [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]; then
            test "$TARGET" = "$CANONICAL_COMMIT"
          fi

          printf '%s\n' "$CANONICAL_COMMIT" > canonical-commit.txt

          ARCHIVE="$ARCHIVE" python - <<'PY'
          import os
          from pathlib import Path
          expected = {"module.json", "SHA256SUMS.txt", os.environ["ARCHIVE"]}
          actual = {p.name for p in Path("alias-assets").iterdir() if p.is_file()}
          if actual != expected:
              raise SystemExit(f"Canonical asset set mismatch: {sorted(actual)}")
          PY

      - name: Create compatibility alias release
        shell: bash
        run: |
          ALIAS="${{ steps.control.outputs.alias_tag }}"
          CANONICAL="${{ steps.control.outputs.canonical_tag }}"
          TITLE="${{ steps.control.outputs.title }}"
          COMMIT="$(cat canonical-commit.txt)"

          cat > alias-notes.md <<EOF
          # Cybermancy GM QOL compatibility alias: $ALIAS

          This is a compatibility-oriented alias of **$CANONICAL**.

          - Foundry VTT: **13**
          - Daggerheart: **1.x**
          - Supported Daggerheart range: **1.2 through 1.9**
          - Canonical semantic release: **$CANONICAL**
          - Target commit: `$COMMIT`

          The runtime ZIP, `module.json`, and `SHA256SUMS.txt` attached here are copied byte-for-byte from the canonical qualified release. No rebuild or code change is associated with this alias.

          Use the semantic release for ordinary version tracking; use this alias when you want a memorable URL identifying the supported Foundry/Daggerheart infrastructure generation.
          EOF

          if gh release view "$ALIAS" >/dev/null 2>&1; then
            echo "Compatibility alias release $ALIAS already exists; refusing to replace it."
            exit 1
          fi

          gh release create "$ALIAS" \
            alias-assets/* \
            --target "$COMMIT" \
            --title "$TITLE" \
            --notes-file alias-notes.md \
            --latest=false

      - name: Verify alias identity, assets, and latest-release stability
        shell: bash
        run: |
          ALIAS="${{ steps.control.outputs.alias_tag }}"
          CANONICAL="${{ steps.control.outputs.canonical_tag }}"
          ARCHIVE="${{ steps.control.outputs.runtime_asset }}"
          EXPECTED="${{ steps.control.outputs.runtime_sha256 }}"
          COMMIT="$(cat canonical-commit.txt)"

          gh release view "$ALIAS" \
            --json tagName,isDraft,isPrerelease,targetCommitish,url,assets \
            > alias-release.json

          ALIAS="$ALIAS" ARCHIVE="$ARCHIVE" COMMIT="$COMMIT" python - <<'PY'
          import json, os, subprocess
          data=json.load(open("alias-release.json"))
          if data["tagName"] != os.environ["ALIAS"]:
              raise SystemExit("Alias tag mismatch")
          if data["isDraft"] or data["isPrerelease"]:
              raise SystemExit("Alias release must be published and non-prerelease")
          names=sorted(a["name"] for a in data["assets"])
          expected_names=sorted([os.environ["ARCHIVE"], "module.json", "SHA256SUMS.txt"])
          if names != expected_names:
              raise SystemExit(f"Alias assets mismatch: {names}")
          tag_commit=subprocess.check_output(
              ["git", "rev-list", "-n", "1", os.environ["ALIAS"]],
              text=True,
          ).strip()
          if tag_commit != os.environ["COMMIT"]:
              raise SystemExit(f"Alias tag targets {tag_commit}, expected {os.environ['COMMIT']}")
          PY

          LATEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$LATEST" = "$CANONICAL"

          mkdir -p alias-verify
          gh release download "$ALIAS" --dir alias-verify --pattern "$ARCHIVE"
          test "$(sha256sum "alias-verify/$ARCHIVE" | awk '{print $1}')" = "$EXPECTED"
